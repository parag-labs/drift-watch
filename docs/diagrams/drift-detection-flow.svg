<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="890" viewBox="0 0 1560 890" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="890" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">DriftWatch - drift detection flow</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Bin both samples on the reference's ruler, score the shift, then classify it into a severity you can gate on.</text><rect x="50" y="170" width="300" height="212" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="161" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - SAMPLES IN</text><rect x="70" y="202" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,217) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="233" font-size="16.5" font-weight="700" fill="#136b74">Reference</text><text x="87" y="255.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">what the model trained on</text><rect x="70" y="286" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,301) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/></g><text x="116" y="317" font-size="16.5" font-weight="700" fill="#136b74">Live</text><text x="87" y="339.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">what production sends now</text><rect x="400" y="206" width="300" height="140" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(416,221) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="446" y="237" font-size="16.5" font-weight="700" fill="#552fae">Bin on reference edges</text><text x="417" y="259.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">edges span reference min..max</text><text x="417" y="276.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">equal-width, 10 bins by default</text><text x="417" y="294.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">live clamps to the end bins</text><rect x="770" y="206" width="300" height="140" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(786,221) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g><text x="816" y="237" font-size="16.5" font-weight="700" fill="#17509f">Proportions</text><text x="787" y="259.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">e[] = reference shares</text><text x="787" y="276.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a[] = live shares</text><text x="787" y="294.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">same bins, sum to 1</text><rect x="1140" y="206" width="300" height="140" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1156,221) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1186" y="237" font-size="16.5" font-weight="700" fill="#552fae">Score the shift</text><text x="1157" y="259.0" font-size="12.3" fill="#6b7794" font-family="Consolas,ui-monospace,Menlo,monospace">PSI = sum (a-e)*ln(a/e)</text><text x="1157" y="276.8" font-size="12.3" fill="#6b7794" font-family="Consolas,ui-monospace,Menlo,monospace">KL  = sum a*ln(a/e)</text><path d="M332,236 L398,264" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M332,320 L398,288" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="342.112" y="292.0" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="365.0" y="308.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">both</text><path d="M702,276 L768,276" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="704.912" y="264.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="735.0" y="280.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">counts</text><path d="M1072,276 L1138,276" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1073.4" y="264.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1105.0" y="280.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">shares</text><rect x="50" y="430" width="1440" height="258" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="421" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">2 - CLASSIFY BY PSI LEVEL</text><rect x="680" y="452" width="180" height="82" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(758.0,466) scale(1.0000)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="770.0" y="510" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3d4a63">PSI level</text><path d="M1290,346 L1290.0,393.0 Q1290,408 1275.0,408.0 L785.0,408.0 Q770,408 770.0,423.0 L770,450" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="975.648" y="396.0" width="108.704" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="1030" y="412.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">the PSI number</text><rect x="110" y="566" width="380" height="112" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(126,581) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="156" y="597" font-size="16.5" font-weight="700" fill="#186547">Stable</text><text x="127" y="619.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">PSI &lt; 0.10</text><text x="127" y="636.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">distribution held</text><text x="127" y="654.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">nothing to do</text><rect x="580" y="566" width="380" height="112" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(596,581) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="626" y="597" font-size="16.5" font-weight="700" fill="#8c5a0d">Minor drift</text><text x="597" y="619.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">0.10 &lt;= PSI &lt; 0.25</text><text x="597" y="636.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">watch, do not page yet</text><rect x="1050" y="566" width="380" height="112" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1066,581) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="1096" y="597" font-size="16.5" font-weight="700" fill="#9e2b36">Major drift</text><text x="1067" y="619.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">PSI &gt;= 0.25</text><text x="1067" y="636.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">alert or retrain</text><text x="1067" y="654.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">CLI exits 1</text><path d="M770,534 L770.0,542.0 Q770,550 762.0,550.0 L307.0,550.0 Q300,550 300.0,557.0 L300,564" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="450.712" y="538.0" width="38.576" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="470" y="554.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">low</text><path d="M770,535 L770,563" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><path d="M770,534 L770.0,542.0 Q770,550 778.0,550.0 L1233.0,550.0 Q1240,550 1240.0,557.0 L1240,564" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="1007.112" y="538.0" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1030" y="554.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">high</text><rect x="50" y="710" width="720" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="734" font-size="13.2" font-weight="700" fill="#3d4a63">Bins are anchored to the reference</text><text x="66" y="756" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Both samples are binned on edges from the reference's min..max.</text><text x="66" y="774.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">A constant reference widens the top edge by +1 so it is never zero-width.</text><text x="66" y="792.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Live values beyond that range clamp into the first or last bin.</text><rect x="790" y="710" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="734" font-size="13.2" font-weight="700" fill="#186547">Why the score is safe to gate on</text><text x="806" y="756" font-size="12.4" fill="#186547" fill-opacity="0.92">Every proportion is floored at eps = 1e-6, so PSI and KL stay finite</text><text x="806" y="774.4" font-size="12.4" fill="#186547" fill-opacity="0.92">and never negative - even for empty bins or a constant sample.</text><text x="806" y="792.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Boundaries 0.10 and 0.25 fall in the higher band; only major exits 1.</text><text x="780.0" y="872" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/drift-watch</text></svg>